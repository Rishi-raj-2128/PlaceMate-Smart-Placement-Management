name: PlaceMate CI

concurrency:
  group: placemate-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Validate Docker Compose configuration
        run: DB_PASSWORD=ci-db-password MYSQL_ROOT_PASSWORD=ci-root-password JWT_SECRET=Y2ktc2VjcmV0LWZvci1jb25maWctdmFsaWRhdGlvbi1vbmx5 docker compose config --quiet
      - name: Validate Nginx configuration
        run: docker run --rm --add-host backend:127.0.0.1 -v "${GITHUB_WORKSPACE}/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t

  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: placemate_ci_password
          MYSQL_DATABASE: placemate_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pplacemate_ci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/placemate_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: placemate_ci_password
      JWT_SECRET: Y2ktb25seS1ub3QtYS1wcm9kdWN0aW9uLXNlY3JldC1rZXktMzItYnl0ZXM=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: placemate_e2e_password
          MYSQL_DATABASE: placemate_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pplacemate_e2e_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/placemate_e2e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: placemate_e2e_password
      JWT_SECRET: Y2ktZW5kLXRvLWVuZC10ZXN0LW9ubHktc2VjcmV0LTMyaXRl
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install frontend and browser test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start backend
        run: |
          mvn -B -f backend/pom.xml spring-boot:run > /tmp/placemate-backend.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/placemate-backend.log
          exit 1
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
