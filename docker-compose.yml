services:
  database:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: placemate_db
      MYSQL_USER: placemate
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in your environment}
    volumes:
      - placemate_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","127.0.0.1","-u","root","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://database:3306/placemate_db?useSSL=false&serverTimezone=UTC
      DB_USERNAME: placemate
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      JWT_SECRET: ${JWT_SECRET:?Set a unique Base64 JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      PLACEMATE_UPLOAD_DIR: /app/uploads/resumes
    volumes:
      - placemate_resumes:/app/uploads/resumes
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  placemate_mysql:
  placemate_resumes:
