spring:
  application:
    name: placemate-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/placemate_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.placemate: INFO

# Use a unique, randomly generated Base64 secret outside local development.
# The fallback is only for local development and must never be used in production.
app:
  jwt:
    secret: ${JWT_SECRET:bG9jYWwtZGV2LW9ubHktcGxhY2VtYXRlLWp3dC1zZWNyZXQta2V5LTIwMjY=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Upload limits and configurable resume storage
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

placemate:
  upload-dir: ${PLACEMATE_UPLOAD_DIR:uploads/resumes}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
